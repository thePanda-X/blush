[package]
name = "blush"
version = "0.3.0"
edition = "2024"
description = "A Grok-Build-style fullscreen coding-agent TUI that drives Claude Code over the Agent Client Protocol"
license = "Apache-2.0"

[[bin]]
name = "blush"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
dirs = "5.0"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
ignore = "0.4"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.29", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
ureq = "3.5.2"
which = "8"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
